<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Zone Converter</title><link rel="stylesheet" href="style.css"></head><body>
<main class="wrap"><header><div><p class="eyebrow">SELF-HOSTED UTILITY</p><h1>Time Zone Converter</h1><p class="sub">Convert a date and time between time zones instantly.</p></div><button id="now" class="secondary">Use current time</button></header>
<section class="card input-card"><div class="grid"><label>Date<input id="date" type="date"></label><label>Time<input id="time" type="time" step="60"></label></div><label>From time zone<select id="from"></select></label><div class="actions"><button id="swap" class="secondary">⇅ Swap time zones</button></div><label>Convert to<select id="to"></select></label></section>
<section class="card result"><p class="result-label" id="targetLabel">DENVER / MOUNTAIN TIME</p><div id="resultTime" class="big">—</div><div id="resultDate" class="dateout">—</div><div class="meta"><span id="abbr">—</span><span id="offset">—</span></div><button id="copy">Copy converted time</button><p id="status" aria-live="polite"></p></section>
<footer>Default destination: America/Denver • Automatically handles daylight saving time.</footer></main><script src="app.js"></script></body></html>
